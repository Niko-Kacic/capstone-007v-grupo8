<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Auditor CAPSTONE APT122</title>
    <link rel="stylesheet" href="Bot/styles.css">
  </head>
  <body>
    <main>
      <section class="audit-box" aria-label="Auditor CAPSTONE APT122">
        <form class="audit-form" id="audit-form">
          <label>
            <span class="sr-only">URL del repositorio GitHub</span>
            <input
              id="repo-url"
              name="repo-url"
              type="url"
              placeholder="https://github.com/usuario/repositorio"
              required
            >
          </label>
          <button class="sr-only" type="submit">Revisar</button>
        </form>
        <p class="message" id="message" role="status"></p>
      </section>

      <section class="report" id="report" aria-live="polite" hidden></section>
    </main>

    <script type="module" src="Bot/app.mjs"></script>
  </body>
</html>
